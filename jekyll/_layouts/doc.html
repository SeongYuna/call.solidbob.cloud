<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root{
    --room:   #080B12;
    --panel:  #10151F;
    --steel:  #6E8FD6;
    --core:   #FFE6A8;
    --gold:   #F5A623;
    --deep:   #B45309;
    --text:   #DFE4EE;
    --dim:    #79839B;
    --border: rgba(223,228,238,.12);

    --f-display: 'Syne', 'Pretendard Variable', sans-serif;
    --f-body:    'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    --f-mono:    'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--room);
    color:var(--text);
    font-family:var(--f-body);
    -webkit-font-smoothing:antialiased;
  }

  header.site-header{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.25rem 2rem;
    border-bottom:1px solid var(--border);
    overflow:hidden;
  }
  /* "홀로그램이 놓인 자리" 느낌 — 브랜드 판 뒤 은은한 방사형 광원. 애니메이션 없이
     CSS만으로, 본문이 많은 페이지에서도 가볍게 유지한다. */
  header.site-header::before{
    content:"";
    position:absolute;
    left:-4rem; top:50%;
    width:22rem; height:22rem;
    transform:translateY(-50%);
    background:radial-gradient(circle, rgba(245,166,35,.16), transparent 68%);
    pointer-events:none;
  }
  header.site-header .site-name{
    position:relative;
    font-family:var(--f-mono);
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:.08em;
    color:var(--text);
    text-decoration:none;
  }
  header.site-header nav{ position:relative; }
  header.site-header nav a{
    font-family:var(--f-mono);
    color:var(--dim);
    text-decoration:none;
    margin-left:1.75rem;
    font-size:0.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  header.site-header nav a:hover{ color:var(--gold); }

  main{ max-width:860px; margin:0 auto; padding:3rem 1.5rem 4rem; }
  main h1{
    font-family:var(--f-display);
    font-weight:800;
    font-size:1.9rem;
    letter-spacing:-.01em;
    margin:0 0 2.5rem;
    color:var(--text);
  }
  main h2{
    font-family:var(--f-mono);
    color:var(--gold);
    font-size:0.9rem;
    letter-spacing:.05em;
    font-weight:600;
    margin:2.25rem 0 0.75rem;
    padding-bottom:0.6rem;
    border-bottom:1px solid var(--border);
  }
  main h2:first-of-type{ margin-top:0; }
  main h3{ font-size:0.95rem; font-weight:700; margin:1.5rem 0 0.5rem; color:var(--text); }
  main ol.subitems{ list-style:none; margin:0 0 1rem; padding:0; }
  main ol.subitems li{ display:flex; gap:0.6rem; padding:0.5rem 0; font-size:0.95rem; }
  main ol.subitems li .num{ font-family:var(--f-mono); color:var(--dim); flex-shrink:0; }
  main ol.subitems li a{ color:var(--text); text-decoration:none; }
  main ol.subitems li a:hover{ color:var(--gold); text-decoration:underline; }
  main .back-link{ display:inline-block; margin-top:2.5rem; color:var(--gold); text-decoration:none; font-size:0.9rem; font-family:var(--f-mono); }
  main .back-link:hover{ text-decoration:underline; }

  main p, main table, main ul:not(.subitems), main ol:not(.subitems), main blockquote, main pre{ text-align:left; font-size:0.95rem; line-height:1.75; }
  main a{ color:var(--gold); }
  main strong{ color:var(--text); }
  main hr{ border:none; border-top:1px solid var(--border); margin:2rem 0; }

  main table{ width:100%; border-collapse:collapse; margin:1rem 0; font-size:0.88rem; }
  main table th{
    font-family:var(--f-mono);
    font-size:0.72rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--dim);
    background:var(--panel);
  }
  main table th, main table td{ border:1px solid var(--border); padding:0.55rem 0.75rem; text-align:left; vertical-align:top; }
  main table td.nowrap{ white-space:nowrap; }
  main table code{ font-size:0.82em; }

  main pre{
    background:var(--panel);
    border:1px solid var(--border);
    padding:1rem;
    overflow-x:auto;
    border-radius:6px;
    font-size:0.85rem;
    font-family:var(--f-mono);
  }
  main code{ font-family:var(--f-mono); background:rgba(223,228,238,.08); padding:0.1em 0.35em; border-radius:4px; font-size:0.88em; }
  main pre code{ background:none; padding:0; }
  main blockquote{
    border-left:3px solid var(--gold);
    background:rgba(245,166,35,.05);
    margin:1rem 0;
    padding:0.6rem 1.1rem;
    color:var(--dim);
    border-radius:0 6px 6px 0;
  }
  main blockquote strong{ color:var(--core); }
  main img{ max-width:100%; }

  /* 태그·역할 배지류(칸반, 요구 ID 등)는 모노스페이스 HUD 톤으로 통일 */
  main .role, main .tag-badge{
    font-family:var(--f-mono);
    font-size:0.68rem;
    letter-spacing:.04em;
  }

  footer{
    border-top:1px solid var(--border);
    padding:2.5rem 2rem;
    display:grid;
    grid-template-columns:1.1fr 0.8fr 1.4fr;
    gap:2rem;
    font-size:0.82rem;
    color:var(--dim);
  }
  footer .col strong{
    display:block;
    font-family:var(--f-mono);
    font-size:0.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
    margin-bottom:0.5rem;
  }
  footer a{ color:var(--dim); text-decoration:none; }
  footer a:hover{ color:var(--gold); }
  @media (max-width:640px){ footer{ grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* 방향 전환 공지 — _includes/pivot-201.html */
  main .notice{ border-left:4px solid #d97706; background:#fffbeb; padding:.9rem 1.2rem;
    margin:1.6rem 0; border-radius:0 4px 4px 0; font-size:.94em; }
  main .notice h3{ margin-top:0; font-size:1.02em; }
  main .notice > *:last-child{ margin-bottom:0; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/toc/' | relative_url }}">목차</a>
      <a href="{{ '/kanban/' | relative_url }}">칸반</a>
      <a href="{{ '/progress/' | relative_url }}">개발 로그</a>
      <a href="{{ '/open-items/' | relative_url }}">미결 항목</a>
    </nav>
  </header>

  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

  <footer>
    <div class="col">
      <strong>{{ site.title }}</strong>
      {{ site.description }}
    </div>
    <div class="col">
      <strong>SOLIDBOB</strong>
    </div>
    <div class="col">
      {{ site.description }}
    </div>
  </footer>
</body>
</html>

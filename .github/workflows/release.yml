# Requirement: [Task 1], B-2, SEC-2
#
# 릴리스 — 이미지를 굽고 EC2 의 k3s 에 배포한다.
#
# 왜 이 모양인가
#  ① **버전은 저장소가 정한다.** `infra/k8s/base/kustomization.yaml` 의 images.newTag 를
#     읽어 그 태그로 굽는다. CI 가 태그를 만들어 저장소에 되쓰지 않는다 — main 이 보호돼
#     있어 봇이 push 할 수 없고, 되쓰면 「저장소 = 클러스터」 불변식이 흔들린다.
#     **버전 올리기는 PR 안에서 사람이 한다.** 그래서 "이번 머지가 배포인가"가 눈에 보인다.
#  ② **인스턴스에서 git 을 쓰지 않는다.** 러너가 `kubectl kustomize` 로 렌더한 YAML 을
#     SSM 으로 실어 보낸다. 인스턴스에 git 도 저장소 클론도 없고(2026-09-09 확인),
#     굳이 만들 이유도 없다 — **CI 가 렌더한 그 YAML 이 그대로 적용된다.**
#  ③ **SSM 을 쓰는 이유는 포트를 열지 않기 위해서다.** 러너 IP 는 매번 바뀌는데
#     6443·22 는 담당자 IP 하나로만 열려 있다. SSM 은 인바운드를 하나도 열지 않는다.
#  ④ **자격증명을 저장하지 않는다.** OIDC 로 callguard-deploy-role 을 빌린다(1시간 임시).
#     신뢰 정책이 이 저장소의 refs/heads/main 으로 한정한다.
#  ⑤ **이미지는 둘이고 따로 판단한다** (2026-09-11 게이트웨이 추가) — server(`server/`·`ai/`)와
#     gateway(`services/gateway/`). 태그도 kustomization 에 따로 있고, «코드가 바뀌었는데 태그 그대로면 실패»도
#     이미지마다 건다. 게이트웨이 토큰 시크릿은 **인스턴스 안에서 없을 때만 무작위로 만든다** —
#     값이 GitHub·SSM 명령·로그 어디에도 실리지 않는다(`infra/k8s/base/secret.example.yaml` ③).
#
# ⚠ 이 워크플로를 main 룰셋의 **필수 통과 검사에 넣지 않는다.** 넣으면 배포가 PR 머지를 막는다.

name: 릴리스 — 이미지 빌드 · k3s 배포

on:
  push:
    branches: [main]
    # 문서만 고친 머지로는 배포하지 않는다. main 머지가 곧 사이트 배포이기도 해서
    # (pages.yml) 걸러 두지 않으면 진행 기록 한 줄에 API 가 재배포된다.
    paths:
      - "server/**"
      - "ai/**"
      - "services/gateway/**"
      - "infra/docker/**"
      - "infra/k8s/**"
      - ".dockerignore"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force_build:
        description: "같은 태그가 레지스트리에 있어도 덮어써서 굽는다"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC 토큰 발급 — 이게 없으면 역할을 못 빌린다
  contents: read

concurrency:
  group: release
  # 배포 도중에 취소하면 클러스터가 어중간한 상태로 남는다. 줄을 세운다.
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  SERVER_IMAGE: seongyuna/callguard-server
  GATEWAY_IMAGE: seongyuna/callguard-gateway
  HEALTH_URL: https://server.solidbob.cloud/health
  GATEWAY_HEALTH_URL: https://server.solidbob.cloud/gateway/health

jobs:
  # ── 무엇을 배포할지 정한다 ────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.changed.outputs.build }}
      gateway_tag: ${{ steps.read.outputs.gateway_tag }}
      gateway_build: ${{ steps.changed.outputs.gateway_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 직전 커밋과 비교해야 한다

      - name: kustomization 에서 이미지 태그를 읽는다
        id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib, sys
          text = pathlib.Path("infra/k8s/base/kustomization.yaml").read_text(encoding="utf-8")
          # 출력 이름 `tag` 는 server 것이다(예전 이름 그대로 — 아래 참조가 많다).
          for key, image in (("tag", "seongyuna/callguard-server"), ("gateway_tag", "seongyuna/callguard-gateway")):
              m = re.search(r'-\s*name:\s*' + re.escape(image) + r'\s*\n\s*newTag:\s*"?([^"\s]+)"?', text)
              if not m:
                  sys.exit(f"kustomization.yaml 에서 {image} 의 newTag 를 찾지 못했습니다.")
              print(f"{key}={m.group(1)}")
          PY
          echo "배포할 태그: $(grep -E '^(tag|gateway_tag)=' "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: 이미지를 다시 구워야 하는지 본다
        id: changed
        env:
          SERVER_TAG: ${{ steps.read.outputs.tag }}
          GATEWAY_TAG: ${{ steps.read.outputs.gateway_tag }}
          FORCE: ${{ inputs.force_build }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          # 이미지 하나를 판단한다. $1=출력 접두어(없으면 server) $2=이미지 $3=태그 $4=이미지에 들어가는 경로(정규식)
          decide() {
            local out="$1" image="$2" tag="$3" paths="$4" exists code
            # ① 레지스트리에 그 태그가 있는가. 없으면 반드시 굽는다 — 없는 이미지를 적용하면 ImagePullBackOff 다.
            #    매니페스트만 바꿔 newTag 를 올린 PR 이 정확히 이 경우다.
            if docker manifest inspect "$image:$tag" > /dev/null 2>&1; then exists=true; else exists=false; fi
            # ② 이미지에 들어가는 코드가 바뀌었는가.
            if echo "$CHANGED" | grep -qE "$paths"; then code=true; else code=false; fi
            echo "[$image] 태그 $tag — 레지스트리에 있음: $exists · 코드 변경: $code"
            # ③ 코드가 바뀌었는데 태그가 그대로면 **조용히 옛 이미지가 계속 돈다.** imagePullPolicy: IfNotPresent 라
            #    노드가 캐시를 재사용한다 — rollout restart 를 해도 새 이미지를 안 받아오고 명령은 성공한 것처럼 보인다.
            if [ "$code" = "true" ] && [ "$exists" = "true" ] && [ "$FORCE" != "true" ]; then
              echo "::error::$image 에 들어가는 코드가 바뀌었는데 newTag 가 '$tag' 그대로입니다."
              echo "같은 태그로 다시 구워도 노드는 캐시된 옛 이미지를 계속 씁니다(IfNotPresent)."
              echo "infra/k8s/base/kustomization.yaml 의 newTag 를 올려 PR 로 넣으세요."
              exit 1
            fi
            if [ "$exists" = "false" ] || [ "$FORCE" = "true" ]; then
              echo "${out}build=true" >> "$GITHUB_OUTPUT"
            else
              echo "${out}build=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # 경로는 **그 이미지에 실제로 들어가는 것만** 본다. 예전엔 server 가 `infra/docker/` 전체를 봐서,
          # gateway.Dockerfile 을 고쳐도 «server 코드 변경» 으로 잡혔다. `.dockerignore` 는 둘 다에 걸린다.
          decide "" "$SERVER_IMAGE" "$SERVER_TAG" '^(server/|ai/|infra/docker/server\.Dockerfile|\.dockerignore)'
          # 게이트웨이 이미지는 src/ 와 package*.json 만 담는다(gateway.Dockerfile) — test/·README 는 태그를 올릴 일이 아니다.
          decide "gateway_" "$GATEWAY_IMAGE" "$GATEWAY_TAG" '^(services/gateway/(src/|package(-lock)?\.json)|infra/docker/gateway\.Dockerfile|\.dockerignore)'

  # ── 이미지를 굽고 Docker Hub 에 올린다 ────────────────────────────────────
  image:
    name: image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: . # ⚠ 저장소 루트. main.py 가 ../ai/apps 를 참조한다
          file: infra/docker/server.Dockerfile
          platforms: linux/amd64 # EC2 가 x86_64 다. arm64 로 구우면 exec format error
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ needs.plan.outputs.tag }}
            ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gateway-image:
    name: gateway-image
    needs: plan
    if: needs.plan.outputs.gateway_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: . # 저장소 루트 — server 와 같은 .dockerignore 를 쓴다
          file: infra/docker/gateway.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ needs.plan.outputs.gateway_tag }}
            ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }}
          # server 와 캐시가 섞이지 않게 범위를 나눈다.
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  # ── k3s 에 적용한다 ──────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: [plan, image, gateway-image]
    # plan 이 성공했을 때만 — plan 이 실패하면 두 image 는 skipped 가 되는데, 그걸 «구울 게 없었다» 로 읽고
    # 배포가 돌았다(2026-09-10 #61 — 태그 검사에 걸렸는데도 deploy 가 초록). 이미지는 구웠거나 건너뛰었어야 한다.
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.gateway-image.result == 'success' || needs.gateway-image.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubectl 설치
        run: |
          # 러너 이미지에 kubectl 이 있다는 보장이 없다. /usr/local/bin 에 직접 쓰면
          # 권한에 걸릴 수 있어 받아서 sudo 로 옮긴다.
          VER=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLo kubectl "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: 매니페스트를 렌더한다
        run: |
          kubectl kustomize infra/k8s/base/ > manifest.yaml
          echo "렌더된 리소스:"; grep -E '^kind:' manifest.yaml | sort | uniq -c
          # 자격증명이 섞여 들어가지 않았는지 확인한다 (SEC-2).
          if grep -qE '^kind: Secret' manifest.yaml; then
            echo "::error::렌더 결과에 Secret 이 들어 있습니다. kustomization 의 resources 를 확인하세요."
            exit 1
          fi

      - name: AWS 자격증명 (OIDC — 저장된 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 인스턴스가 켜져 있는지 본다
        id: state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "인스턴스 상태: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" != "running" ]; then
            echo "::notice::인스턴스가 '$STATE' 라 배포를 건너뜁니다. 켜면 부팅 시 자동 수렴이 최신 상태를 적용합니다."
          fi

      - name: SSM 으로 적용한다
        id: apply
        if: steps.state.outputs.state == 'running'
        run: |
          # YAML 을 base64 로 실어 보낸다 — 따옴표·줄바꿈 이스케이프 문제를 통째로 없앤다.
          B64=$(base64 -w0 manifest.yaml)
          KC="KUBECONFIG=/etc/rancher/k3s/k3s.yaml"

          python3 - "$B64" > params.json <<'PY'
          import json, sys
          b64 = sys.argv[1]
          kc = "KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
          # 게이트웨이 토큰 — 없을 때만 **인스턴스 안에서** 무작위로 만든다. 값은 이 명령 문자열에 없고
          # (`$(...)` 는 인스턴스의 셸이 푼다), kubectl 은 이름만 찍는다. 이미 있으면 건드리지 않는다 — 돌리면
          # 생산자·대시보드가 들고 있는 값이 무효가 된다. 교체는 사람이 한다(secret.example.yaml ③).
          rand = "$(head -c {n} /dev/urandom | od -An -tx1 | tr -d ' \\n')"
          make_tokens = (
            f"{kc} kubectl -n callguard create secret generic gateway-tokens"
            f" --from-literal=GATEWAY_INGEST_TOKEN=\"{rand.format(n=24)}\""
            f" --from-literal=GATEWAY_VIEW_TOKEN=\"{rand.format(n=16)}\""
          )
          cmds = [
            "set -e",
            "mkdir -p /opt/callguard",
            # 부팅 시 자동 수렴 유닛이 이 파일을 다시 적용한다.
            f"echo '{b64}' | base64 -d > /opt/callguard/current.yaml",
            f"{kc} kubectl apply -f /opt/callguard/current.yaml",
            "NEW_TOKENS=0",
            f"{kc} kubectl -n callguard get secret gateway-tokens >/dev/null 2>&1 || {{ {make_tokens}; NEW_TOKENS=1; }}",
            # 파드가 토큰보다 먼저 떴으면 값이 비어 있다(optional) — 새로 만들었을 때만 다시 띄운다.
            f"if [ \"$NEW_TOKENS\" = 1 ]; then {kc} kubectl -n callguard rollout restart deploy/callguard-gateway; fi",
            f"{kc} kubectl -n callguard rollout status deploy/callguard-server --timeout=180s",
            f"{kc} kubectl -n callguard rollout status deploy/callguard-gateway --timeout=180s",
            f"{kc} kubectl -n callguard get pods -o wide",
          ]
          json.dump({"commands": cmds}, open(1, "w"))
          PY

          CID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "release server ${{ needs.plan.outputs.tag }} gateway ${{ needs.plan.outputs.gateway_tag }} (${{ github.sha }})" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "명령 ID: $CID"

          # 끝날 때까지 기다린다. 결과를 회수하지 않으면 실패해도 CI 가 초록이 된다.
          # 끝나거나 5분이 지날 때까지 기다린다.
          for i in $(seq 1 60); do
            sleep 5
            ST=$(aws ssm get-command-invocation --command-id "$CID" \
                   --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                   --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$ST" in
              Success|Failed|Cancelled|TimedOut)
                echo "SSM 명령 종료: $ST"
                break
                ;;
            esac
          done

          echo "── 표준 출력 ──"
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text
          echo "── 표준 오류 ──"
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' --output text

          FINAL=$(aws ssm get-command-invocation --command-id "$CID" \
                    --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                    --query 'Status' --output text)
          echo "최종 상태: $FINAL"
          [ "$FINAL" = "Success" ]

      - name: 스모크 테스트
        if: steps.state.outputs.state == 'running'
        run: |
          # 스포크는 못 꽂히면 **오류 없이** 501 로 남는다(_project/decisions/024) — 서버는 떠 있어도
          # 기능이 조용히 빠진다. 그래서 `spokes` 에 기대한 것이 **전부** 있는지 본다.
          # 전에는 retrieval 하나만 봐서, 2026-09-11 `0.1.2` 가 trigger 없이(ai/provider.py 누락) 초록으로 나갔다.
          # 스포크를 새로 꽂으면 여기에도 더한다.
          EXPECTED="masking closure_gate retrieval trigger"
          for i in $(seq 1 12); do
            BODY=$(curl -fsS -m 10 "$HEALTH_URL" || true)
            echo "$BODY"
            MISSING=$(printf '%s' "$BODY" | python3 -c '
          import json, sys
          try:
              spokes = set(json.load(sys.stdin).get("spokes", []))
          except ValueError:
              spokes = set()
          print(" ".join(s for s in sys.argv[1:] if s not in spokes))' $EXPECTED)
            if [ -n "$BODY" ] && [ -z "$MISSING" ]; then
              echo "✅ /health 정상 — spokes 에 $EXPECTED 전부 있음"; exit 0
            fi
            sleep 5
          done
          echo "::error::/health 의 spokes 에 빠진 것: ${MISSING:-응답 없음}"
          exit 1

      - name: 스모크 테스트 — 게이트웨이
        if: steps.state.outputs.state == 'running'
        run: |
          # 파드가 떴다는 것만으로는 부족하다 — 키·캡·토큰이 하나라도 없으면 게이트웨이는 떠 있어도 **전부 거절한다**
          # (fail-closed 로 만들었기 때문이다). 배포가 초록인데 쓸 수 없는 상태를 여기서 빨간불로 만든다.
          for i in $(seq 1 12); do
            BODY=$(curl -fsS -m 10 "$GATEWAY_HEALTH_URL" || true)
            if [ -n "$BODY" ]; then break; fi
            sleep 5
          done
          echo "$BODY"
          printf '%s' "$BODY" | python3 -c '
          import json, sys
          try:
              h = json.load(sys.stdin)
          except ValueError:
              sys.exit("::error::게이트웨이 /gateway/health 가 응답하지 않는다")
          need = ["stt_credentials_configured", "stt_caps_configured", "ingest_token_configured", "view_token_configured"]
          missing = [k for k in need if h.get(k) is not True]
          if h.get("status") != "ok" or missing:
              sys.exit("::error::게이트웨이가 떠 있지만 쓸 수 없다 — false: " + (", ".join(missing) or "status"))
          print("✅ 게이트웨이 정상 — 구글 키·STT 캡·두 토큰 모두 설정됨")'

      - name: 실패하면 되돌린다
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          echo "::warning::배포 실패 — 멈춘 Deployment 만 직전 리비전으로 되돌립니다."
          # 멀쩡히 끝난 쪽은 되돌리지 않는다 — 게이트웨이가 실패했다고 server 를 옛 판으로 돌리면 안 된다.
          # 게이트웨이를 처음 올리다 실패하면 되돌릴 리비전이 없다(`|| true`) — 서버에는 영향이 없다.
          CID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["export KUBECONFIG=/etc/rancher/k3s/k3s.yaml","for d in callguard-server callguard-gateway; do kubectl -n callguard rollout status deploy/$d --timeout=5s || kubectl -n callguard rollout undo deploy/$d || true; done"]' \
            --query 'Command.CommandId' --output text)
          echo "롤백 명령 ID: $CID"

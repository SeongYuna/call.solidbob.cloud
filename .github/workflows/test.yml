name: CI — 하네스 테스트 · 구조 계약 · 사이트 빌드

# 회귀 방지용이다. "완성됐는가"가 아니라 "어제 되던 게 오늘도 되는가"를 본다.
# 4인이 여러 브랜치에서 병합하는 구조라, 누군가의 머지가 하네스를 깨도
# 자동으로 돌지 않으면 다음에 손으로 돌린 사람이 우연히 발견하게 된다.
#
# 범위를 좁게 유지한다:
#  - requirements.txt 전체를 설치하지 않는다. torch·transformers 는 테스트가 쓰지 않는다.
#    테스트가 실제로 import 하는 것만 설치한다 (pytest · fastapi · httpx(TestClient) · import-linter).
#  - 기준선 미달 시 실패(기획서 6.2절)는 아직 넣지 않는다. 측정값이 없어서
#    무조건 실패하거나 가짜 기준선을 넣게 된다 — 절대 원칙 2번 위반.
#    2주차 잠정 베이스라인이 나온 뒤 별도로 붙인다.
#  - 실제 DB·ES·외부 API 가 필요한 테스트는 각 pytest.ini 의 `-m "not integration"` 로 빠진다.
#    **예외: `server` 의 PostgreSQL integration 테스트는 여기서 돈다(2026-09-11).** 매번 새로 띄운
#    postgres:17 에 현재 db/schema.sql 을 넣고 돌린다 — 스키마가 바뀌었는데 어댑터가 안 따라가면
#    여기서 빨간불이 된다. 이게 없어서 09-09~09-11 전사 저장이 새 스키마에서 전부 실패하는데도 초록이었다.
#  - 진행 기록 확인은 경고만 낸다(exit 0). 기록 누락으로 코드 머지를 막지 않는다
#  - 구조 계약(import-linter 5종, docs/harness.md §1)은 테스트와 별개 step — 계층 위반은 테스트가 못 잡는다

on:
  push:
    branches: [main, PM, ai, server, frontend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# ⚠ job 이름 `server` · `ai` · `jekyll` 은 main 브랜치 보호의 **필수 통과 검사 이름**이다.
#   이름을 바꾸면 보호 설정이 존재하지 않는 검사를 기다리게 되어 PR 이 영원히 머지되지 않는다.
#   바꿀 때는 룰셋(Settings → Rules → Rulesets → main → Require status checks)을 **함께** 고친다.
#   2026-08-26: fastapi/ 를 server/ · ai/ 로 나누면서 job `backend` → `server` + `ai` 로 갈렸다.
#   2026-08-26: 브랜치도 디렉터리 이름에 맞췄다 — `backend`→`ai`(류준) · `ai`→`server`(장민석).
#   위 트리거 목록이 브랜치 이름에 걸린 유일한 곳이다. job 이름(= 필수 통과 검사)은 브랜치명과 무관하다.
jobs:
  server:
    # 요청이 흐르는 길 — 계약(포트·DTO)·파이프라인 배선·클린 아키텍처.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # integration 테스트 전용 일회용 DB. job 이 끝나면 사라진다. 인증 없이(trust) 띄워 저장소에
      # 암호를 두지 않는다 — 러너 안에서만 열리는 컨테이너라 밖에서 닿지 않는다(SEC-2).
      # 버전은 운영 RDS(런북 6-1)와 같은 17.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: callguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # server/conftest.py 의 integration_settings 가 이 값만 쓴다(.env 를 보지 않는다)
      CALLGUARD_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/callguard_test
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 테스트 의존성 설치
        # 버전은 server/requirements.txt 의 고정값과 같게 유지한다. psycopg 는 integration 테스트용.
        run: pip install pytest==9.1.1 fastapi==0.141.1 httpx==0.28.1 import-linter==2.13 "psycopg[binary]==3.2.10"

      - name: 테스트 실행
        run: pytest

      - name: 스키마 적용 (db/schema.sql → 새 DB)
        # 운영(런북 17장)과 같은 파일을 같은 방식(한 번에 실행)으로 넣는다. 생성물이라 고칠 곳은
        # db/generate_schema_docs.py 다. 한 문장이라도 실패하면 이 step 이 실패한다.
        run: |
          python - <<'PY'
          import os, pathlib, psycopg
          sql = pathlib.Path("../db/schema.sql").read_text(encoding="utf-8")
          with psycopg.connect(os.environ["CALLGUARD_TEST_DATABASE_URL"]) as conn:
              conn.execute(sql)
              n = conn.execute("select count(*) from pg_tables where schemaname='public'").fetchone()[0]
          print(f"적용 완료 — {n} 테이블")
          PY

      - name: PostgreSQL integration 테스트
        # 기본 실행(`-m "not integration"`)과 따로 돈다. 0건 수집으로 초록이 되지 않게 개수를 본다.
        # ⚠ `shell:` 을 안 쓴 run 은 `bash -e` 이고 pipefail 이 **꺼져 있다** — 그대로 두면 `| tee` 가
        #   pytest 의 실패를 삼켜 빨간불이 초록이 된다(2026-09-11 a5 세션이 재현). 그래서 맨 앞에서 켠다.
        run: |
          set -o pipefail
          pytest -m integration -rs | tee integration.log
          grep -qE "[0-9]+ passed" integration.log || { echo "::error::integration 테스트가 하나도 돌지 않았다"; exit 1; }
          if grep -q "SKIPPED" integration.log; then echo "::error::integration 테스트가 스킵됐다 — DB 설정을 확인한다"; exit 1; fi

      - name: 구조 계약 검사 (import-linter)
        run: PYTHONPATH=apps lint-imports --config .importlinter

  ai:
    # 품질을 만들고 재는 쪽 — 청킹·검색·리랭크·모델·평가 하네스.
    # torch·transformers 는 설치하지 않는다. 지금 테스트가 쓰지 않고, 매번 수 GB 를 받게 된다.
    # 모델이 실제로 필요한 테스트는 @pytest.mark.slow / integration 으로 빠진다.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 테스트 의존성 설치
        # 버전은 ai/requirements.txt 의 고정값과 같게 유지한다.
        run: pip install pytest==9.1.1 pydantic==2.13.4 import-linter==2.13 numpy==2.5.2

      - name: 테스트 실행
        # evaluation 이 hub 의 계약(포트·DTO)을 import 한다 — 의존 방향 ai → server.
        # pytest.ini 의 pythonpath 가 ../server/apps 를 올린다.
        run: pytest

      - name: 구조 계약 검사 (import-linter)
        run: PYTHONPATH=apps:../server/apps lint-imports --config .importlinter

  jekyll:
    # 사이트가 곧 산출물이다. main 에 머지되는 순간 배포되므로, 깨진 채로 들어가면
    # 그때서야 알게 된다. 머지 전에 빌드와 내부 링크를 확인한다.
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 진행 기록 검사가 git log 로 커밋 날짜를 읽는다. 얕은 클론이면 1건만 보인다.
          fetch-depth: 0

      - name: 루비 설치
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll

      - name: 사이트 빌드
        run: bundle exec jekyll build
        working-directory: jekyll

      - name: 내부 링크 검사
        # 파일 이름이나 소제목을 바꾸면 링크가 조용히 깨진다. 빌드는 통과하므로
        # 사람이 클릭해 보기 전까지 아무도 모른다. 로컬에서도 같은 명령으로 확인할 수 있다.
        run: python3 scripts/check_site_links.py jekyll/_site

      - name: 진행 기록 확인 (경고만)
        # 커밋이 있는 날짜에 progress.markdown 항목이 있는지 본다.
        # 실패시키지 않는다 — 로그 누락은 코드 결함이 아니고, 이걸로 머지를 막으면
        # 급할 때 아무 줄이나 적고 통과시키는 회피가 생겨 기록의 질이 오히려 나빠진다.
        # 로컬에서 강하게 보려면: python3 scripts/check_progress_log.py --strict
        run: python3 scripts/check_progress_log.py --days 7

  gateway:
    # A-1~A-4 게이트웨이 (services/gateway, Node.js). 구글·서버 없이 가짜 포트로 돈다.
    # ⚠ 이 job 은 아직 main 룰셋의 필수 통과 검사가 아니다(2026-09-11 추가). 필수로 걸려면
    #   룰셋에 `gateway` 를 더한다 — 저장소 admin(정성윤) 몫. 이름을 바꾸면 그때 룰셋도 같이 고친다.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 노드 설치
        # 24 — .ts 를 빌드 없이 그대로 돌린다(타입 제거 실행). package.json engines 는 >=22.18.
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        # `npx tsc` 가 아니라 스크립트로 — 로컬 typescript 를 못 찾으면 무관한 패키지를 받아 초록이 된다(harness.md §2).
        run: npm run typecheck

      - name: 테스트
        # 0건 수집으로 초록이 되지 않게 통과 개수를 본다. `shell:` 을 안 쓴 step 은 pipefail 없이
        # 돌아서 `| tee` 가 실패를 삼킨다 — 첫 줄에서 켜고, 실패 개수도 따로 본다(두 겹).
        run: |
          set -o pipefail
          npm test 2>&1 | tee gateway-test.log
          grep -qE "^ℹ pass [1-9]" gateway-test.log || { echo "::error::게이트웨이 테스트가 하나도 돌지 않았다"; exit 1; }
          if grep -qE "^ℹ fail [1-9]" gateway-test.log; then echo "::error::게이트웨이 테스트 실패"; exit 1; fi

# 일회용 진단 워크플로. OIDC 가 붙은 뒤 삭제한다.
# 토큰 자체는 절대 찍지 않는다 — sub·aud·repository 만 본다(비밀값이 아니다).
name: OIDC 진단 (일회용)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Secret 의 ARN 이 기대값과 같은가
        env:
          ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # 비교 결과만 찍는다. ARN 자체는 마스킹돼 출력해도 ***로 가려진다.
          EXPECT="arn:aws:iam::621724235711:role/callguard-deploy-role"
          if [ "$ARN" = "$EXPECT" ]; then
            echo "✅ ARN 정확히 일치"
          else
            echo "❌ ARN 불일치 — 오타·공백·줄바꿈 가능성"
            echo "   저장된 길이: ${#ARN}  (기대: ${#EXPECT})"
          fi

      - name: GitHub 이 보내는 OIDC 클레임
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==" ;; 3) PAYLOAD="$PAYLOAD=" ;; esac
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, ref, repository_owner}'

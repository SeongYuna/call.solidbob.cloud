# Requirement: [Task 1], B-2, SEC-2
#
#   kubectl apply -k infra/k8s/base/
#
# **이 파일은 2026-09-08 EC2 에 실제로 떠 있는 구성을 그대로 옮긴 것이다.**
# 손으로 만든 클러스터가 인스턴스 안에만 있으면 인스턴스가 사라질 때 같이 사라진다.
#
# 먼저 넣어야 하는 것 (kustomize 밖 — 자격증명·클러스터 스코프라 저장소에 두지 않는다):
#   ① cert-manager 설치 + clusterissuer.example.yaml (이메일 채워서)
#   ② secret.example.yaml 의 시크릿 2개 (server-env · gcp-stt-credentials)
#
# 이미지 태그를 올릴 때는 아래 images: 한 곳만 고친다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: callguard

resources:
  - namespace.yaml
  - elasticsearch.yaml
  - redis.yaml          # 관리자 로그인 세션(5분). 휘발 — 볼륨 없음(decisions/112)
  - server.yaml
  - call-mediator.yaml
  - ollama.yaml         # D-1 통화 후 요약 모델(CPU). 디스크 60GB 가 먼저다(decisions/146)
  - ingress.yaml
  # secret.example.yaml · clusterissuer.example.yaml 은 일부러 넣지 않는다.

images:
  # 0.1.41 은 건너뛰었다 — `origin/PM` 이 먼저 집었다(2026-09-23 `82924b3`). 겹치면 `tag-check` 오류다(`decisions/131`).
  # ⚠ 주석은 `- name:` 위에 쓴다 — 판정기가 `- name:` **바로 다음 줄**에서 newTag 를 찾는다(2026-09-24 실제로 깨뜨렸다).
  # 0.1.46 · 0.2.14 는 건너뛰었다 — `origin/server` 가 먼저 집었다(2026-10-06, `decisions/131`). F-3 브리핑 · C-6 베타(기본 꺼짐)
  - name: seongyuna/callguard-server
    newTag: "0.1.47"
  - name: seongyuna/callguard-es
    newTag: "9.5.1"
  # 콜 미디에이터(services/call-mediator). server 와 태그를 따로 올린다 — release.yml 이 이미지마다 판단한다.
  - name: seongyuna/callguard-call-mediator
    newTag: "0.2.15"

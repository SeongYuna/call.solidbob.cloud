# Requirement: A-1, A-3, COST-1, SEC-1, SEC-2
# 게이트웨이(services/gateway) — 오디오 중계 + Google STT 스트리밍 + server 전달.
# server 와 같은 노드·같은 네임스페이스에 따로 뜬다. 밖에서는 Ingress `/gateway` 경로로만 닿는다(ingress.yaml).
#
# 자격증명은 저장소에 없다(SEC-2). 둘 다 이미 있는 것을 쓰거나 배포가 만든다 —
#   ① gcp-stt-credentials — server 가 이미 마운트하는 구글 키 파일 시크릿(secret.example.yaml ②)
#   ② gateway-tokens      — 두 토큰. **release.yml 이 없을 때만 인스턴스 안에서 무작위로 만든다**
#                           (값이 GitHub·SSM 명령·로그 어디에도 실리지 않는다, secret.example.yaml ③)
# server-env 는 **받지 않는다.** 거기엔 DATABASE_URL 이 있고 게이트웨이는 DB 를 쓰지 않는다. 게이트웨이가 쓰는
# 설정(STT 캡·허용 origin)은 비밀이 아니라서 아래에 값으로 적는다 — 운영 시크릿에 그 키가 있는지에 기대지 않는다
# (09-08 에 만든 server-env 에 무엇이 들었는지 저장소로는 알 수 없다 — a5 세션 검토, 2026-09-11).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: callguard-gateway
spec:
  # 하나다. 통화 상태(발화 번호·채널)가 프로세스 메모리에 있어서, 둘로 늘리면 한 통화의 두 화자가
  # 다른 파드로 갈 수 있다. 사용량 장부(hostPath)도 한 프로세스만 쓴다.
  replicas: 1
  # 겹쳐 뜨지 않게 — 옛 파드가 장부를 쓰고 내려간 뒤 새 파드가 읽는다. 배포 중 몇 초 끊긴다.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: callguard-gateway }
  template:
    metadata:
      labels: { app: callguard-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node 이미지의 node 사용자
        runAsGroup: 1000
      initContainers:
        # hostPath 는 root 소유로 만들어진다. node 사용자가 장부를 쓸 수 있게 소유권만 넘긴다.
        - name: ledger-owner
          image: busybox:1.37
          command: ["sh", "-c", "chown 1000:1000 /ledger"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - { name: ledger, mountPath: /ledger }
      containers:
        - name: gateway
          image: seongyuna/callguard-gateway:0.1.1
          imagePullPolicy: IfNotPresent
          # 구글 키 파일 이름은 시크릿을 만든 사람이 정한다(`--from-file=<키파일>.json`). 이름에 기대지 않고
          # 마운트된 첫 .json 을 쓴다 — 없으면 빈 값이 되어 게이트웨이가 /ingest 를 거절한다(가짜로 대신하지 않는다).
          command:
            - sh
            - -c
            - 'export GOOGLE_APPLICATION_CREDENTIALS="$(ls /var/run/gcp/*.json 2>/dev/null | head -n 1)"; exec node src/main.ts'
          env:
            - { name: GATEWAY_PORT, value: "8080" }
            # 같은 네임스페이스의 Service 이름(런북 16-1). localhost 를 기본값으로 굳히지 않는다.
            - { name: CORE_API_URL, value: "http://callguard-server" }
            # COST-1 2차 캡. 1차는 GCP 콘솔 쿼터(Audio seconds per day = 600, w1-stt-billing-quota)이고
            # 로컬 .env 와 같은 값이다. 바꾸면 GCP 쿼터도 같이 본다 — 2차가 1차보다 크면 의미가 없다.
            - { name: STT_MAX_SECONDS_PER_DAY, value: "600" }
            - { name: STT_MAX_SECONDS_PER_MONTH, value: "3600" }
            # 대시보드 WebSocket 의 Origin 허용 목록 — 배포된 대시보드(Vercel) + 로컬 Vite.
            # 로컬 Vite 를 넣은 것은 개발자가 자기 노트북 대시보드로 운영 게이트웨이를 볼 수 있게 하려는 것이다
            # (뷰 토큰은 여전히 필요하다). server 의 CORS 와는 별개다 — 그쪽은 server-env 가 정한다.
            - { name: CORS_ALLOWED_ORIGINS, value: "https://call.solidbob.cloud,http://localhost:5173,http://127.0.0.1:5173" }
            # 없으면 루프백 밖을 전부 거절한다(fail-closed) — 파드는 뜨고 /health 가 `*_token_configured: false`.
            - name: GATEWAY_INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: gateway-tokens, key: GATEWAY_INGEST_TOKEN, optional: true } }
            - name: GATEWAY_VIEW_TOKEN
              valueFrom: { secretKeyRef: { name: gateway-tokens, key: GATEWAY_VIEW_TOKEN, optional: true } }
          ports:
            - { containerPort: 8080, protocol: TCP }
          readinessProbe:
            # /health 는 토큰 없이 된다(쿠버네티스 프로브). 자막·과금과 무관한 숫자만 싣는다.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: gcp, mountPath: /var/run/gcp, readOnly: true }
            # COST-1 사용량 장부. 노드 디스크에 둬서 파드를 다시 띄워도 오늘 쓴 초가 0 이 되지 않는다.
            - { name: ledger, mountPath: /app/data/processed }
      volumes:
        - name: gcp
          secret:
            secretName: gcp-stt-credentials
            # 없어도 파드는 뜬다 — 키가 없으면 게이트웨이가 /ingest 를 거절하고 /health 가
            # stt_credentials_configured:false 로 드러낸다. 로컬 리허설(infra/k8s/local)이 따로 패치할 필요도 없다.
            optional: true
        - name: ledger
          hostPath:
            path: /opt/callguard/stt-usage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: callguard-gateway
spec:
  type: ClusterIP
  selector: { app: callguard-gateway }
  ports:
    # Ingress 백엔드가 80 을 본다. 컨테이너는 8080 이다.
    - { port: 80, targetPort: 8080 }

# Requirement: SEC-2
#
# ⚠ **이 파일을 그대로 apply 하지 않는다.** 키 이름만 보여주는 템플릿이고,
#    kustomization 의 resources 에서도 일부러 뺐다. 실제 값이 저장소에 들어가면
#    안 된다(CLAUDE.md §8 — 커밋이 곧 발행이다).
#
# 시크릿 3개가 필요하다. ③ 은 배포가 알아서 만든다.
#
# ── ① server-env — .env 전체(16개 키). RDS 접속 정보가 여기 들어간다 ──────────
#
#   kubectl create secret generic server-env -n callguard --from-env-file=.env
#
#   ⚠ `.env` 가 최신인지 먼저 확인한다. 2026-09-08 에 MYSQL_* → POSTGRES_* 로
#     고쳤다(decisions/107) — 옛 파일을 넣으면 서버는 정상으로 뜨는데
#     /health 가 postgres_configured: false 를 **에러 없이** 뱉는다.
#
#   ⚠ **이미 있는 시크릿의 DB 값만 RDS 로 바꿀 때는 위 명령을 쓰지 않는다** —
#     `docs/infra-runbook.md` 12-2 의 patch 절차(백업 → 키 확인 → patch → 재시작)를 따른다.
#
#   server 가 실제로 읽는 키 (server/core/config.py):
#     DATABASE_URL  **그리고**  POSTGRES_HOST·POSTGRES_PORT·POSTGRES_DB_NAME·
#                               POSTGRES_USER·POSTGRES_PASSWORD — **둘 다 같은 RDS 값으로 넣는다**
#       (2026-09-11, _project/decisions/108). 이미지 0.1.1 은 POSTGRES_* 만 읽고 0.1.2 부터는
#       DATABASE_URL 을 먼저 읽는다. 09-08~09-11 운영 DB 는 POSTGRES_HOST 가 비고 DATABASE_URL 이
#       Neon 이라 **한 번도 연결되지 않았다** — 두 규칙이 서로 다른 값을 보고 있었다.
#       /health 의 postgres_configured 는 둘 중 하나만 있어도 true 라 이걸 못 잡는다.
#     DATABASE_URL 형식: postgresql://callguard:<암호>@<엔드포인트>:5432/assist?sslmode=require
#       ⚠ 사용자는 callguard, **DB 는 assist** 다(RDS 실물, 2026-09-11 확인). POSTGRES_DB_NAME 도 assist.
#       RDS PostgreSQL 15+ 는 SSL 이 강제된다(rds.force_ssl=1). 암호는 영문·숫자만(런북 6-2).
#     ELASTICSEARCH_URL       → http://elasticsearch:9200
#     ELASTICSEARCH_API_KEY   → 로컬·단일노드에서는 비워 둔다
#     HUGGINGFACE_TOKEN       → 공개 모델이면 비워도 된다
#     GOOGLE_APPLICATION_CREDENTIALS → 아래 ② 가 마운트되는 **파일 경로**
#
#   관리자 로그인(구글) 키 3종 — 2026-09-15 추가 (`decisions/403`·`112`)
#     GOOGLE_OAUTH_CLIENT_ID  → 구글 클라우드 콘솔의 **웹 애플리케이션 클라이언트 ID**.
#                               `...apps.googleusercontent.com`. 비밀이 아니다(프론트 번들에도 같은 값이
#                               들어간다) — 그래도 여기 있는 이유는 서버가 **audience 검증**에 쓰기 때문이다.
#                               값이 다르면 로그인이 전부 401 이고, 비어 있으면 프로바이더가 RuntimeError 다.
#     ADMIN_JWT_SECRET        → access token(HS256) 서명 키. **진짜 비밀이다.** 32바이트 이상 무작위:
#                                 openssl rand -hex 32
#                               바꾸면 발급돼 있던 access token 이 전부 무효가 된다(refresh 로 복구된다).
#     REDIS_URL               → redis://redis:6379/0  ← 클러스터 안 ClusterIP 이름(`redis.yaml`)
#                               ElastiCache 가 아니다. 암호가 없으니 이 주소를 밖에 열지 않는다.
#
#   ⚠ `CORS_ALLOWED_ORIGINS` 에 관리자 화면 origin 도 넣는다 — 상담원 화면과 **다른 오리진**이다.
#     예: https://call.solidbob.cloud,https://admin.solidbob.cloud
#     빠지면 브라우저가 `/admin/auth/google` 을 프리플라이트에서 막고, 서버 로그에는 아무것도 안 남는다.
#
#   모델 키 4종 — 2026-09-15 추가, **선택**(류준, `w5-ner-p6-p7` · `decisions/206` · `207`)
#     PII_NER_MODEL_DIR          → C-5 P6·P7 NER. 비우면 규칙 마스킹만(지금 운영과 같다)
#     RETRIEVAL_EMBED_MODEL_DIR  → B-2 KoE5 임베딩 검색. 비우면 BM25 단독
#     RETRIEVAL_RERANK_MODEL_DIR → B-3 리랭커. 임베딩이 켜졌을 때만 쓰인다
#     GENERATION_MODEL           → B-4 서류 목록 생성(`decisions/207`, 예: kanana-1.5-2.1b-instruct:q4_k_m).
#                                  **OLLAMA_URL 과 둘 다 있어야 켜진다** — OLLAMA_URL 은 런북 16-1 이 이미 넣으므로
#                                  이 키를 비워 두면 지금처럼 스니펫 카드다. 켜기 전에 ollama 파드에 모델을 등록한다(207 「운영 반영」)
#     ⚠ 위 세 모델 경로 키는 **지금 이미지로는 값을 넣어도 안 켜진다** — 서버 이미지에 torch·transformers·모델 가중치가
#       없다(런북 13-1). 넣으면 조용히 규칙·BM25 로 내려가고, 켜졌는지는 /health `spokes` 의
#       `pii_ner` · `retrieval_dense` · `rerank` 로 본다. 이미지·볼륨 결정은 [미결](/open-items/).
#
#   넣지 않는 키: AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY — 서버 코드가 읽지 않는다
#     (core/config.py 에 AWS 항목 없음). 로컬 .env 를 통째로 넣으면 따라 들어가므로
#     만든 뒤 빼거나(런북 12-2 ④) 넣기 전에 지운다. 쓰지 않는 정적 자격증명을 파드에 두지 않는다.
#
# ── ② gcp-stt-credentials — Google STT 서비스 계정 키 **파일** ────────────────
#
#   kubectl create secret generic gcp-stt-credentials -n callguard \
#     --from-file=<키파일>.json
#
#   값이 아니라 파일이라 볼륨으로 마운트한다(server.yaml). 마운트 경로는
#   /home/hi/.gcp 이고, ① 의 GOOGLE_APPLICATION_CREDENTIALS 가
#   /home/hi/.gcp/<키파일>.json 을 가리켜야 한다.
#
# ── ③ call-mediator-tokens — 콜 미디에이터 두 토큰 (2026-09-11) ──────────────────────
#
#   **사람이 만들지 않는다.** release.yml 이 배포할 때 없으면 **인스턴스 안에서** 무작위로 만든다 —
#   값이 GitHub·SSM 명령 기록·로그 어디에도 실리지 않는다. 이미 있으면 건드리지 않는다.
#     CALL_MEDIATOR_INGEST_TOKEN  48자 hex — /ingest(STT 과금) **진짜 비밀**. 오디오 생산자만 갖는다
#     CALL_MEDIATOR_VIEW_TOKEN    32자 hex — /ws(자막 보기). 대시보드 번들에 들어가면 비밀이 아니다
#   (services/call-mediator/src/domain/access.ts — 둘을 가른 이유가 거기 있다)
#
#   값 꺼내기 (인스턴스에서, SSM 세션):
#     sudo k3s kubectl -n callguard get secret call-mediator-tokens \
#       -o jsonpath='{.data.CALL_MEDIATOR_INGEST_TOKEN}' | base64 -d; echo
#   교체 (값이 샜을 때): 지우고 다시 배포하면 새로 만든다 — 들고 있던 생산자·대시보드는 새 값으로 바꿔야 한다
#     sudo k3s kubectl -n callguard delete secret call-mediator-tokens
#     → main 머지 또는 release.yml 수동 실행(workflow_dispatch)
#
#   콜 미디에이터는 server-env 를 **받지 않는다** — DATABASE_URL 이 있고 콜 미디에이터는 DB 를 쓰지 않는다.
#   STT 캡·허용 origin 은 비밀이 아니라 call-mediator.yaml 에 값으로 적었다. ② 의 키 파일만 같이 마운트한다
#   (/var/run/gcp — 파일 이름에 기대지 않는다).
#
# ⚠ 세 시크릿 모두 인스턴스가 사라지면 같이 사라진다. RDS 암호·엔드포인트와
#   GCP 키 파일은 따로 안전한 곳에 보관하거나 SSM Parameter Store 에 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: server-env
  namespace: callguard
type: Opaque
stringData:
  DATABASE_URL: ""        # ...?sslmode=require
  POSTGRES_HOST: ""       # ↓ DATABASE_URL 과 같은 RDS 값
  POSTGRES_PORT: "5432"
  POSTGRES_DB_NAME: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  ELASTICSEARCH_URL: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
  # --- 테스트 음성 보관 (A-6, 2026-09-14 `_project/decisions/110`) ---
  #   S3_BUCKET · UPLOAD_TOKEN 이 **둘 다** 있어야 업로드가 켜진다. 하나만 있으면 안 꽂히고 501 로 남는다.
  #   AWS 키는 넣지 않는다 — boto3 가 EC2 인스턴스 역할(callguard-ec2-role)을 IMDSv2 로 가져온다.
  #   2026-09-14 운영 파드에서 확인했다(토큰 발급 성공 → 역할: callguard-ec2-role).
  #   UPLOAD_TOKEN 은 팀원에게 나눠 주는 값이다. 만들기: openssl rand -hex 16
  S3_BUCKET: ""                 # assist-apne2 (런북 5장)
  AWS_REGION: "ap-northeast-2"
  UPLOAD_TOKEN: ""              # 비우면 업로드 문이 잠긴다(fail-closed)
  UPLOAD_MAX_BYTES: "104857600" # 100MB. S3 정책 content-length-range 상한으로도 나간다
  # --- 쓰기 경로 서비스 토큰 (2026-09-20 `_project/decisions/120`) ---
  #   콜 미디에이터 → 서버의 쓰기 일곱 경로를 잠근다. 09-20 운영 왕복에서 이 경로들이 **토큰 없이 200** 이었다.
  #   ⚠ **비우면 열린다**(UPLOAD_TOKEN 과 반대 — 이행기 동작). `/health` 의 `ingest_guard` 가 "open"/"locked" 로 말한다.
  #   ⚠ **미디에이터가 같은 값을 헤더로 보내기 전에 채우면 통화가 전부 401 로 막힌다** — 순서는 120 「전환 순서」.
  #   만들기: openssl rand -hex 32   (UPLOAD_TOKEN·콜 미디에이터 토큰과 **같은 값으로 두지 않는다**)
  INGEST_SERVICE_TOKEN: ""
  # 발신 번호 → 고객 식별자 HMAC 키(2026-09-14, `decisions/304`). 없으면 통화는 열리고 고객 연결만 안 된다.
  # ⚠ 바꾸거나 잃으면 기존 customer_id·블랙리스트 등록을 다시 찾을 수 없다 — 한 번 만들고 보관한다
  CUSTOMER_REF_HMAC_KEY: ""

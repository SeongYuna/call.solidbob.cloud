# Requirement: SEC-2
#
# ⚠ **이 파일을 그대로 apply 하지 않는다.** 키 이름만 보여주는 템플릿이고,
#    kustomization 의 resources 에서도 일부러 뺐다. 실제 값이 저장소에 들어가면
#    안 된다(CLAUDE.md §8 — 커밋이 곧 발행이다).
#
# 시크릿 3개가 필요하다. ③ 은 배포가 알아서 만든다.
#
# ── ① server-env — .env 전체(16개 키). RDS 접속 정보가 여기 들어간다 ──────────
#
#   kubectl create secret generic server-env -n callguard --from-env-file=.env
#
#   ⚠ `.env` 가 최신인지 먼저 확인한다. 2026-09-08 에 MYSQL_* → POSTGRES_* 로
#     고쳤다(decisions/107) — 옛 파일을 넣으면 서버는 정상으로 뜨는데
#     /health 가 postgres_configured: false 를 **에러 없이** 뱉는다.
#
#   ⚠ **이미 있는 시크릿의 DB 값만 RDS 로 바꿀 때는 위 명령을 쓰지 않는다** —
#     `docs/infra-runbook.md` 12-2 의 patch 절차(백업 → 키 확인 → patch → 재시작)를 따른다.
#
#   server 가 실제로 읽는 키 (server/core/config.py):
#     DATABASE_URL  **그리고**  POSTGRES_HOST·POSTGRES_PORT·POSTGRES_DB_NAME·
#                               POSTGRES_USER·POSTGRES_PASSWORD — **둘 다 같은 RDS 값으로 넣는다**
#       (2026-09-11, _project/decisions/108). 이미지 0.1.1 은 POSTGRES_* 만 읽고 0.1.2 부터는
#       DATABASE_URL 을 먼저 읽는다. 09-08~09-11 운영 DB 는 POSTGRES_HOST 가 비고 DATABASE_URL 이
#       Neon 이라 **한 번도 연결되지 않았다** — 두 규칙이 서로 다른 값을 보고 있었다.
#       /health 의 postgres_configured 는 둘 중 하나만 있어도 true 라 이걸 못 잡는다.
#     DATABASE_URL 형식: postgresql://callguard:<암호>@<엔드포인트>:5432/assist?sslmode=require
#       ⚠ 사용자는 callguard, **DB 는 assist** 다(RDS 실물, 2026-09-11 확인). POSTGRES_DB_NAME 도 assist.
#       RDS PostgreSQL 15+ 는 SSL 이 강제된다(rds.force_ssl=1). 암호는 영문·숫자만(런북 6-2).
#     ELASTICSEARCH_URL       → http://elasticsearch:9200
#     ELASTICSEARCH_API_KEY   → 로컬·단일노드에서는 비워 둔다
#     HUGGINGFACE_TOKEN       → 공개 모델이면 비워도 된다
#     GOOGLE_APPLICATION_CREDENTIALS → 아래 ② 가 마운트되는 **파일 경로**
#
#   넣지 않는 키: AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY — 서버 코드가 읽지 않는다
#     (core/config.py 에 AWS 항목 없음). 로컬 .env 를 통째로 넣으면 따라 들어가므로
#     만든 뒤 빼거나(런북 12-2 ④) 넣기 전에 지운다. 쓰지 않는 정적 자격증명을 파드에 두지 않는다.
#
# ── ② gcp-stt-credentials — Google STT 서비스 계정 키 **파일** ────────────────
#
#   kubectl create secret generic gcp-stt-credentials -n callguard \
#     --from-file=<키파일>.json
#
#   값이 아니라 파일이라 볼륨으로 마운트한다(server.yaml). 마운트 경로는
#   /home/hi/.gcp 이고, ① 의 GOOGLE_APPLICATION_CREDENTIALS 가
#   /home/hi/.gcp/<키파일>.json 을 가리켜야 한다.
#
# ── ③ gateway-tokens — 게이트웨이 두 토큰 (2026-09-11) ──────────────────────
#
#   **사람이 만들지 않는다.** release.yml 이 배포할 때 없으면 **인스턴스 안에서** 무작위로 만든다 —
#   값이 GitHub·SSM 명령 기록·로그 어디에도 실리지 않는다. 이미 있으면 건드리지 않는다.
#     GATEWAY_INGEST_TOKEN  48자 hex — /ingest(STT 과금) **진짜 비밀**. 오디오 생산자만 갖는다
#     GATEWAY_VIEW_TOKEN    32자 hex — /ws(자막 보기). 대시보드 번들에 들어가면 비밀이 아니다
#   (services/gateway/src/domain/access.ts — 둘을 가른 이유가 거기 있다)
#
#   값 꺼내기 (인스턴스에서, SSM 세션):
#     sudo k3s kubectl -n callguard get secret gateway-tokens \
#       -o jsonpath='{.data.GATEWAY_INGEST_TOKEN}' | base64 -d; echo
#   교체 (값이 샜을 때): 지우고 다시 배포하면 새로 만든다 — 들고 있던 생산자·대시보드는 새 값으로 바꿔야 한다
#     sudo k3s kubectl -n callguard delete secret gateway-tokens
#     → main 머지 또는 release.yml 수동 실행(workflow_dispatch)
#
#   게이트웨이는 server-env 를 **받지 않는다** — DATABASE_URL 이 있고 게이트웨이는 DB 를 쓰지 않는다.
#   STT 캡·허용 origin 은 비밀이 아니라 gateway.yaml 에 값으로 적었다. ② 의 키 파일만 같이 마운트한다
#   (/var/run/gcp — 파일 이름에 기대지 않는다).
#
# ⚠ 세 시크릿 모두 인스턴스가 사라지면 같이 사라진다. RDS 암호·엔드포인트와
#   GCP 키 파일은 따로 안전한 곳에 보관하거나 SSM Parameter Store 에 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: server-env
  namespace: callguard
type: Opaque
stringData:
  DATABASE_URL: ""        # ...?sslmode=require
  POSTGRES_HOST: ""       # ↓ DATABASE_URL 과 같은 RDS 값
  POSTGRES_PORT: "5432"
  POSTGRES_DB_NAME: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  ELASTICSEARCH_URL: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
